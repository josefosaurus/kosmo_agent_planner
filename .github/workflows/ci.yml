name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Package .vsix
        if: github.event_name == 'release'
        run: npx vsce package --no-dependencies

      - name: Upload .vsix artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: kosmo-sidekick-${{ github.event.release.tag_name }}
          path: "*.vsix"

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'release'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret not set — skipping publish"
          else
            npx vsce publish --no-dependencies -p "$VSCE_PAT"
          fi
